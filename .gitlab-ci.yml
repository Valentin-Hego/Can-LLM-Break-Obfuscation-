stages:
  - obfuscate

obfuscation:
  stage: obfuscate
  tags:
    - automatisation
  script:
    - docker info
    - python3 --version
    - python3 -m pip install --user openai
  artifacts:
    when: always
    paths:
      # On pointe maintenant vers l'archive générée par le script
      - outputs.tar.gz
