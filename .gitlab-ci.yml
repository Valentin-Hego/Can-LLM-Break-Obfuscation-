stages:
  - obfuscate

obfuscation_pipeline:
  stage: obfuscate
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
  script:
    - ./scripts/run_all.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - outputs/

