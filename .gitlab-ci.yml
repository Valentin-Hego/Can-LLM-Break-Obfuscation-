stages:
  - debug

debug_env:
  stage: debug
  script:
    - echo "=== WHOAMI ==="
    - whoami
    - echo "=== PATH ==="
    - echo $PATH
    - echo "=== GCC ==="
    - which gcc || echo "gcc not found"
    - gcc --version || true
    - echo "=== DOCKER ==="
    - which docker || echo "docker not found"
    - echo "=== MAKE ==="
    - which make || echo "make not found"

